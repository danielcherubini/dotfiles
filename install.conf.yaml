- defaults:
    link:
      relink: true
      create: true
- link:
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv
    ~/.config/easyeffects: easyeffects
    ~/.config/environment.d: environment.d
    ~/.config/nvim: nvim
    ~/.config/kitty: kitty
    ~/.config/alacritty: alacritty
    ~/.config/chrome-flags.conf: chrome/chrome-flags.conf
    ~/.config/chromium-flags.conf: chrome/chrome-flags.conf
    ~/.local/share/applications/google-chrome.desktop: chrome/google-chrome.desktop
    ~/.config/fusuma: fusuma
    # ~/.config/libinput-gestures.conf: libinput/libinput-gestures.conf
    ~/.tmux.conf: tmux/tmux.conf
    ~/.tmux/tmux.remote.conf: tmux/tmux.remote.conf
    ~/.tmux/yank.sh: tmux/yank.sh
    ~/.tmux/dev: tmux/dev
    ~/.config/clight.conf: clight/clight.conf
    ~/.config/xdg-terminals.list: xdg-terminal-exec/xdg-terminals.list
    ~/.local/share/java: java
    ~/.pi/agent/settings.json: pi/settings.json
    ~/.claude/settings.local.json: claude/settings.local.json
    ~/.config/opencode/opencode.json: opencode/opencode.jsonc
    ~/.config/opencode/dcp.jsonc: opencode/dcp.jsonc
    ~/.config/opencode/package.json: opencode/package.json

    # /mnt/c/Users/danie/AppData/Roaming/alacritty/alacritty.toml: alacritty/windows.toml
- shell:
    - [git submodule update --init --recursive, Installing submodules]
